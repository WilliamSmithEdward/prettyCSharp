[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prettycsharp"
dynamic = ["version"]
description = "An opinionated formatter for C#, in the spirit of Prettier"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "William Smith Edward" }]
keywords = ["csharp", "c#", "formatter", "prettier", "code-style", "dotnet", "tree-sitter"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Two: the tree-sitter runtime and its C# grammar, both MIT and both shipping
# wheels for every supported Python. Ranges here, for the people who install
# the package; .github/requirements/runtime.txt pins what a fresh install gets
# today, for the dependency audit.
dependencies = ["tree-sitter>=0.25", "tree-sitter-c-sharp>=0.23.1"]

[project.optional-dependencies]
# Exact pins, so the gate does not drift under main. They match
# .github/requirements/test.in; Dependabot proposes new versions.
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0"]

[project.scripts]
prettycsharp = "prettycsharp.cli:main"

[project.urls]
Homepage = "https://github.com/WilliamSmithEdward/prettyCSharp"
Repository = "https://github.com/WilliamSmithEdward/prettyCSharp"
Issues = "https://github.com/WilliamSmithEdward/prettyCSharp/issues"

[tool.hatch.version]
path = "src/prettycsharp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prettycsharp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/prettycsharp"]
