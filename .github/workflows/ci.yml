name: CI

# Lint, type-check, test and build on every push to main and every pull
# request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: .github/requirements/test.txt
      - name: Install the test tools, then the package
        run: |
          python -m pip install --require-hashes -r .github/requirements/test.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: python -m ruff check src tests fuzz
      - name: Mypy
        run: python -m mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # Minor versions, not patches: the matrix tests each supported
        # Python as users install it, at its newest patch release.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Line endings, byte order marks and paths depend on the platform,
          # so the whole suite runs on Windows and macOS too.
          - os: windows-2025
            python-version: "3.12"
          - os: macos-26
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/requirements/test.txt
      - name: Install the test tools, then the package
        run: |
          python -m pip install --require-hashes -r .github/requirements/test.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Pytest
        run: python -m pytest -q

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
      - name: Install build tooling
        run: python -m pip install --require-hashes -r .github/requirements/build.txt
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Validate metadata
        run: python -m twine check --strict dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The one check the main ruleset requires. The matrix jobs are named
  # after their Python and runner, which change; this name does not. It
  # fails unless every job above passed, a skipped one included.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check every CI job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
