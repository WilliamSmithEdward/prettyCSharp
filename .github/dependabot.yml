# Dependabot keeps the pinned tools current: the workflows' actions, each
# pinned to a commit with its release named in a comment; the development
# tools pyproject.toml pins exactly; and the hash-locked tools in
# .github/requirements. The runtime dependencies, tree-sitter and its C#
# grammar, are minimum versions in pyproject.toml and move there only when a
# newer one is needed; the locks pin what a fresh install gets today. The
# YARA-X engine and the YARA Forge rules are release downloads Dependabot
# cannot follow; update-yara-rules.yml proposes those. GitHub refuses
# Dependabot's image updates, so update-images.yml proposes new ClamAV and
# Semgrep images.
#
# A release waits a week before it is proposed, long enough for most
# hijacked or broken releases to be found and pulled first. Security
# updates do not wait. tree-sitter-c-sharp 0.24.0 is skipped: it cannot
# parse a `$"..."` statement after an `if` (#74). A later release is still
# proposed, and tests/test_grammar_compatibility.py decides whether it lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    ignore:
      - dependency-name: tree-sitter-c-sharp
        versions: ["0.24.0"]
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: deps
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: [minor, patch]

  # The build, test, fuzz, audit and runtime locks the workflows install,
  # hash-locked in .github/requirements.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: [pyopenvba, pyofficeeditor, pyprettyvba, vba-reference, pyvbaanalysis, pyvbaharness, xlide-mcp]
    ignore:
      - dependency-name: tree-sitter-c-sharp
        versions: ["0.24.0"]
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
